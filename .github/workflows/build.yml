name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default. Only the job that publishes a release is granted
# write, so a compromised step elsewhere in the pipeline cannot rewrite
# releases with the workflow token.
permissions:
  contents: read

jobs:
  # Gate. The release used to publish whatever a tag pointed at, with no lint
  # or test run and nothing tying the tag to the version in the files that
  # ship — so a tag on a red commit shipped, and a v4.2.0 tag could publish a
  # ZIP whose manifest read 4.1.0. Chrome shows the manifest version, so that
  # mismatch reaches users rather than us.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + harness tests
        run: npm test

      - name: Assert tag matches shipped version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/assert-release-version.mjs "${{ github.ref_name }}"

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Build WASM Core
        run: npm run build:wasm

      - name: Build filter rules
        run: npm run build:rules

      - name: Build extension
        run: npm run build:ext

      - name: Package extension ZIP
        run: |
          mkdir -p release
          zip -r release/nullify-${{ github.ref_name || 'dev' }}.zip \
            manifest.json \
            assets/ \
            rules/ \
            dist/ \
            src/shared/wasm/ \
            src/popup/popup.html \
            src/popup/popup.css \
            src/options/options.html \
            src/options/options.css \
            -x "*.map" "rules/skipped/*"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nullify-extension
          path: release/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          body: |
            ## Nullify ${{ github.ref_name }}

            ### Install
            1. Download `nullify-${{ github.ref_name }}.zip` below
            2. Unzip to a folder
            3. Open `chrome://extensions` → enable **Developer mode**
            4. Click **Load unpacked** → select the unzipped folder
            5. Done! Nullify is active.
