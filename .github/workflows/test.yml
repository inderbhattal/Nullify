name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  # All actions pinned to full commit SHAs — see build.yml for rationale.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/shared/wasm/ is a gitignored build product, and
      # src/background/service-worker.js imports its glue statically — so
      # without this step the whole sw-harness suite dies on
      # ERR_MODULE_NOT_FOUND rather than running. It has to be built here, in
      # the job that runs the JS tests; the `rust` job below is a separate
      # runner and its artifacts do not carry over.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm-core/target
          key: cargo-wasm-${{ hashFiles('wasm-core/Cargo.lock') }}

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.13.1'

      - name: Build WASM (required by the service-worker harness)
        run: npm run build:wasm

      - name: Lint
        run: npm run lint

      - name: Unit + harness tests
        run: npm test

  # wasm-core is a third parser implementation alongside the build script and
  # the service worker, and it has drifted from both. Its tests only ever ran
  # locally, which is how ~domain, #@#+js() and the $important inversion
  # survived there after the JS engines were fixed.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        # Pinned to a SHA, so the toolchain must be named explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wasm-core/target
          key: cargo-${{ hashFiles('wasm-core/Cargo.lock') }}

      - name: Unit tests
        run: cargo test --manifest-path wasm-core/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path wasm-core/Cargo.toml --all-targets
